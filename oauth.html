<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Chintu Chaos Uploader</title>
<style>
:root{--bg:#fff7ec;--fg:#1b1f33;--muted:#5d6380;--accent:#ff5a36;--card:#fff;--line:#e5d9c8}
@media (prefers-color-scheme:dark){:root{--bg:#12141f;--fg:#eceef7;--muted:#9aa0bd;--accent:#ff7a5c;--card:#1c1f2e;--line:#2d3247}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:40px 18px}
h1{font-size:30px;margin:0 0 12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;word-break:break-all;font:15px/1.5 ui-monospace,monospace;margin:14px 0}
button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 22px;font:600 16px system-ui;cursor:pointer}
.muted{color:var(--muted)}
</style></head><body><div class="wrap">
<h1 id="h">Approval code</h1>
<p id="p" class="muted">Copy this code and paste it into the "Get YouTube token (one time)" workflow within 10 minutes.</p>
<div class="box" id="code">No code in this address.</div>
<button id="copy" type="button">Copy code</button> <span id="ok" class="muted"></span>
</div>
<script>
const q = new URLSearchParams(location.search);
const code = q.get('code'), err = q.get('error');
const box = document.getElementById('code');
if (code) box.textContent = code;
else if (err) { document.getElementById('h').textContent = 'Access was not granted'; box.textContent = err; document.getElementById('copy').hidden = true; }
else document.getElementById('copy').hidden = true;
document.getElementById('copy').onclick = () => {
  navigator.clipboard.writeText(code).then(() => ok.textContent = 'Copied', () => {
    const r = document.createRange(); r.selectNodeContents(box); getSelection().removeAllRanges(); getSelection().addRange(r); ok.textContent = 'Selected, press Ctrl+C';
  });
};
</script></body></html>
